---
- name: Install and configure MariaDB
  hosts: db
  become: yes

  vars:
    mysql_socket: /run/mysqld/mysqld.sock

  tasks:
    - name: Install MariaDB packages
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Start MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    - name: Allow remote MariaDB connections
      ansible.builtin.copy:
        dest: /etc/mysql/mariadb.conf.d/99-app.conf
        mode: '0644'
        content: |
          [mysqld]
          bind-address = 0.0.0.0
      notify: Restart MariaDB

    - name: Create application database
      ansible.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        encoding: utf8mb4
        login_user: root
        login_unix_socket: "{{ mysql_socket }}"

    - name: Create application database user
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        host: "{{ item }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_user: root
        login_unix_socket: "{{ mysql_socket }}"
        check_implicit_admin: yes
      loop:
        - localhost
        - '%'
      no_log: yes

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted


- name: Install Apache and deploy Laravel application
  hosts: server
  become: yes

  vars:
    app_repo: https://github.com/Practical-DevOps/app-for-devops.git
    app_path: /var/www/app-for-devops
    apache_site: app-for-devops

  tasks:
    - name: Install web server packages
      ansible.builtin.apt:
        name:
          - apache2
          - libapache2-mod-php
          - php
          - php-cli
          - php-curl
          - php-mbstring
          - php-mysql
          - php-xml
          - php-zip
          - php-bcmath
          - composer
          - git
          - nodejs
          - npm
          - unzip
        state: present
        update_cache: yes

    - name: Clone Laravel application
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_path }}"
        force: yes

    - name: Create Laravel environment file
      ansible.builtin.copy:
        src: "{{ app_path }}/.env.example"
        dest: "{{ app_path }}/.env"
        remote_src: yes
        mode: '0640'

    - name: Configure Laravel database connection
      ansible.builtin.lineinfile:
        path: "{{ app_path }}/.env"
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: 'APP_URL', value: 'http://localhost' }
        - { key: 'DB_CONNECTION', value: 'mysql' }
        - { key: 'DB_HOST', value: "{{ db_host }}" }
        - { key: 'DB_PORT', value: '3306' }
        - { key: 'DB_DATABASE', value: "{{ db_name }}" }
        - { key: 'DB_USERNAME', value: "{{ db_user }}" }
        - { key: 'DB_PASSWORD', value: "{{ db_pass }}" }
      no_log: yes

    - name: Install PHP dependencies
      ansible.builtin.command:
        cmd: composer install --no-interaction --prefer-dist
        chdir: "{{ app_path }}"
      environment:
        COMPOSER_ALLOW_SUPERUSER: '1'

    - name: Generate Laravel application key
      ansible.builtin.command:
        cmd: php artisan key:generate --force
        chdir: "{{ app_path }}"

    - name: Run database migrations
      ansible.builtin.command:
        cmd: php artisan migrate --force
        chdir: "{{ app_path }}"

    - name: Install frontend dependencies
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ app_path }}"

    - name: Build frontend assets
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_path }}"

    - name: Set application ownership
      ansible.builtin.file:
        path: "{{ app_path }}"
        owner: www-data
        group: www-data
        recurse: yes

    - name: Enable Apache rewrite module
      ansible.builtin.command:
        cmd: a2enmod rewrite
      changed_when: false

    - name: Create Apache virtual host
      ansible.builtin.copy:
        dest: "/etc/apache2/sites-available/{{ apache_site }}.conf"
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName localhost
              DocumentRoot {{ app_path }}/public

              <Directory {{ app_path }}/public>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
      notify: Restart Apache

    - name: Disable default Apache site
      ansible.builtin.command:
        cmd: a2dissite 000-default
      changed_when: false

    - name: Enable Laravel Apache site
      ansible.builtin.command:
        cmd: "a2ensite {{ apache_site }}"
      changed_when: false

    - name: Start Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
